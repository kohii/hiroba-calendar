name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Format check
        run: pnpm run fmt:check
      
      - name: Lint
        run: pnpm run lint
      
      - name: Type check (scripts only)
        run: tsc --noEmit --skipLibCheck lib/**/*.ts scripts/validator.ts scripts/pdf-discovery.ts scripts/validate-and-merge.ts scripts/verify-pdf-urls.ts scripts/batch-merge.ts scripts/merge-dataset.ts scripts/pdf-download.ts tests/**/*.ts
      
      - name: Test
        run: pnpm test
      
      - name: Build
        run: pnpm exec astro build
      
      - name: Verify build output
        run: |
          if [ ! -f dist/index.html ]; then
            echo "Error: dist/index.html not found"
            exit 1
          fi
          echo "✓ Build successful"
